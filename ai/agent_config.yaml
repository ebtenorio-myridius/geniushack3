# Model + orchestration configuration for the extraction step.
# Actual values are read from environment variables (see src/app/config.py) —
# this file documents the current choices and the reasoning, since "which
# models you used and why" is part of the rubric.

extraction_step:
  provider: openai
  model: gpt-4o-mini
  reasoning: >
    Structured-output extraction from a single document is a well-bounded
    task. gpt-4o-mini keeps token cost down for a high-volume intake step;
    escalate to gpt-4o only if mini's extraction accuracy proves
    insufficient in /evals results.
  call_pattern: structured_outputs   # openai .parse() constrained to a Pydantic schema
  max_input_tokens_budget: ~12000    # raw document text is truncated to this in llm_service.py

scoring_step:
  provider: none
  reasoning: >
    Deterministic weighted rules, not a model call. See
    src/app/services/risk_scoring.py and /docs/architecture for the
    engineering-judgement rationale.

policy_retrieval_step:
  status: implemented
  approach: >
    Semantic retrieval: docs/policies/*.md is chunked and embedded offline
    (tools/embed_policies.py, text-embedding-3-small) into ai/policy_index.json.
    At request time, the change request's own extracted fields are embedded
    and matched by cosine similarity against the cached chunk vectors — top 3
    matches above a similarity floor are returned, each carrying its
    similarity_score and retrieval_method for audit purposes. No vector
    database is used at this corpus size (a few dozen short chunks); an
    in-memory scan is exact and fast. Falls back to a deterministic
    category-keyword match (the original implementation) when the index or
    OPENAI_API_KEY is unavailable, e.g. in CI or during a provider outage —
    see ops/monitoring.md for a real instance of that failure mode.
  source_directory: docs/policies
  index_file: ai/policy_index.json
  production_migration: >
    Swap the in-memory cosine scan for pgvector, Azure AI Search, or similar
    once the policy corpus grows beyond what fits comfortably in memory;
    the PolicyEvidence contract returned to callers does not need to change.

committee_summary_step:
  status: planned
  planned_approach: LLM summary of analyst-finalized assessment for committee review
